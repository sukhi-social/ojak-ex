# Prebuilt NIF libraries for Linux, built with profile-guided optimisation.
#
# On a tag (v*) the libraries are attached to a release. By hand
# ("Run workflow") they are only kept as workflow artifacts.
#
# Each job builds the library twice, with and without the profile, and
# writes the speed of both to its summary: the gain is measured here, on the
# target, not assumed.
name: prebuild

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # glibc 2.35 or newer (Ubuntu 22.04). Built on the oldest glibc we ask for,
  # so that anything newer can load it.
  gnu:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.20"
      - run: scripts/ci-setup-rust.sh
      - run: scripts/ci-prebuild.sh ${{ matrix.target }}
      - run: cat target/summary-${{ matrix.target }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ojak_nif-${{ matrix.target }}
          path: dist/libojak_nif-${{ matrix.target }}.so*
          if-no-files-found: error

  # Alpine (musl). The build runs in a container started by hand, because the
  # JavaScript actions the runner brings do not run inside Alpine.
  musl:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build in elixir:1.20-alpine
        run: |
          docker run --rm -v "$PWD":/work -w /work elixir:1.20-alpine sh -ec '
            apk add --no-cache bash build-base curl git
            scripts/ci-setup-rust.sh
            scripts/ci-prebuild.sh ${{ matrix.target }}
          '
      - run: cat target/summary-${{ matrix.target }}.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ojak_nif-${{ matrix.target }}
          path: dist/libojak_nif-${{ matrix.target }}.so*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gnu, musl]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ojak_nif-*
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
